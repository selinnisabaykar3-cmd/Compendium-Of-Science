<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">


<title>Upload Resources</title>

<link rel="stylesheet"
      href="upload.css">


</head>

<body>

<div class="container">


<h1>Upload Your Resources</h1>

<p>
    Upload your scientific PDFs,
    notes and research materials.
</p>

<div class="upload-box">

    <input type="file"
           id="pdfUpload"
           accept=".pdf">

    <button onclick="uploadFile()">
        Upload Resource
    </button>

</div>

<div id="status"></div>
<h2>Your Resources</h2>

<ul id="resourceList"></ul>

</div>

<script src="upload.js"></script>

</body>
</html>
